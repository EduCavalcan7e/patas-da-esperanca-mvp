name: CI - Patas da Esperança MVP
on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Configurar Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Instalar dependências
        run: pip install fastapi httpx pytest pytest-cov
      - name: Executar testes automatizados com cobertura
        run: PYTHONPATH=backend pytest -v --cov=backend/app --cov-report=term-missing backend/tests
