<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Patas da Esperança — Gestão Sanitária e Adoção</title>
  <style>
    body { font-family: system-ui, sans-serif; background: #f8fafc; color: #0f172a; margin: 0; padding: 16px; }
    .card { background: #fff; border: 2px solid #cbd5e1; border-radius: 12px; padding: 16px; margin-bottom: 12px; }
    .badge { display: inline-flex; align-items: center; gap: 6px; padding: 6px 10px; border-radius: 8px; font-weight: 700; }
    .atrasado { background: #fee2e2; color: #991b1b; border: 1px solid #991b1b; }
    .pendente { background: #fef3c7; color: #92400e; border: 1px solid #92400e; }
    .em-dia { background: #dcfce7; color: #166534; border: 1px solid #166534; }
    button { min-height: 48px; width: 100%; font-size: 1rem; font-weight: 700; border-radius: 10px; border: none; background: #1d4ed8; color: #fff; cursor: pointer; }
  </style>
</head>
<body>
  <header>
    <h1>Patas da Esperança</h1>
    <p id="status-rede" role="status" aria-live="polite">Modo Online — Sincronizado</p>
  </header>
  <main>
    <section class="card" aria-label="Alerta Sanitário">
      <h2>Pipoca — Canina (Médio)</h2>
      <span class="badge atrasado" role="status">⚠️ ATRASADO — Vacina Antirrábica</span>
      <p>Último registo: Baia 03</p>
      <button type="button" onclick="salvarFilaOffline()">Registar Vacina em 1 Toque</button>
    </section>
  </main>
  <script>
    function salvarFilaOffline() {
      const req = indexedDB.open("PatasOfflineDB", 1);
      req.onupgradeneeded = (e) => e.target.result.createObjectStore("fila_vacinas", { autoIncrement: true });
      req.onsuccess = (e) => {
        const tx = e.target.result.transaction("fila_vacinas", "readwrite");
        tx.objectStore("fila_vacinas").add({ animal: "Pipoca", vacina: "Antirrábica", timestamp: Date.now() });
        document.getElementById("status-rede").textContent = "Registo guardado localmente (IndexedDB)";
      };
    }
  </script>
</body>
</html>
